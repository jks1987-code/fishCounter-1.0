<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fish Log" />
  <meta name="theme-color" content="#1a4a6b" />
  <title>Fish Log</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:  #1a4a6b;
      --blue:       #2563a8;
      --blue-light: #4a90c4;
      --teal:       #0e8080;
      --green:      #2d7a3a;
      --gold:       #d4a017;
      --bg:         #f0f6fb;
      --surface:    #ffffff;
      --border:     #c8dde8;
      --text:       #1a2e3b;
      --muted:      #5c7a8a;
      --danger:     #c0392b;
      --radius:     12px;
      --nav-h:      64px;
      --safe-b:     env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100%; max-width: 540px; margin: 0 auto; }
    header {
      background: var(--blue-dark);
      color: #fff;
      padding: 14px 20px 10px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; }
    header .logo { font-size: 1.5rem; }

    main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px); }

    nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 540px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    nav button {
      flex: 1; background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: .68rem; font-weight: 600; color: var(--muted);
      padding: 8px 4px; transition: color .15s;
    }
    nav button .icon { font-size: 1.4rem; }
    nav button.active { color: var(--blue); }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--blue-light); background: #fff; }
    textarea { resize: vertical; min-height: 70px; }

    .species-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip {
      padding: 5px 11px; border-radius: 20px; font-size: .78rem; font-weight: 600;
      background: var(--bg); border: 1.5px solid var(--border);
      cursor: pointer; transition: all .15s; color: var(--muted);
    }
    .chip:hover, .chip.sel { background: var(--blue); border-color: var(--blue); color: #fff; }

    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .toggle-row label { margin: 0; font-size: .9rem; color: var(--text); font-weight: 500; }
    input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--green); }

    .btn {
      display: block; width: 100%; padding: 13px;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); opacity: .85; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-sm {
      display: inline-block; width: auto; padding: 6px 14px;
      font-size: .8rem; border-radius: 8px; font-weight: 600;
    }

    .section-title {
      font-size: .8rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 10px;
    }

    /* ── Catch card ── */
    .catch-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .catch-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .catch-species { font-size: 1.05rem; font-weight: 700; color: var(--blue-dark); }
    .catch-date { font-size: .75rem; color: var(--muted); white-space: nowrap; }
    .catch-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 9px; border-radius: 6px;
      font-size: .75rem; font-weight: 600;
    }
    .badge-blue  { background: #e3f0fb; color: var(--blue); }
    .badge-green { background: #e3f7e8; color: var(--green); }
    .badge-gold  { background: #fdf5e0; color: #a07800; }
    .badge-teal  { background: #e0f7f7; color: var(--teal); }
    .catch-meta  { font-size: .8rem; color: var(--muted); margin-top: 7px; line-height: 1.5; }
    .catch-notes { font-size: .82rem; color: var(--text); margin-top: 7px; font-style: italic; }
    .catch-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

    .released-tag {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; color: var(--green); background: #e3f7e8;
      padding: 2px 7px; border-radius: 4px;
    }

    /* ── Filter bar ── */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select {
      flex: 1; min-width: 100px; padding: 9px 12px; font-size: .88rem;
    }

    /* ── Stats ── */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px; text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .stat-val { font-size: 2rem; font-weight: 800; color: var(--blue-dark); line-height: 1; }
    .stat-label { font-size: .75rem; color: var(--muted); margin-top: 5px; font-weight: 600; }
    .leaderboard { margin-top: 14px; }
    .lb-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 7px;
      font-size: .9rem;
    }
    .lb-rank { font-weight: 800; color: var(--blue); width: 24px; }
    .lb-name { flex: 1; font-weight: 600; }
    .lb-val  { font-size: .82rem; color: var(--muted); font-weight: 600; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty .emoji { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: .95rem; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a2e3b; color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: .88rem; font-weight: 600;
      opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
      z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Confirm overlay ── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 300;
      align-items: flex-end; justify-content: center;
    }
    #overlay.open { display: flex; }
    .overlay-box {
      background: var(--surface); border-radius: 16px 16px 0 0;
      padding: 24px 20px; padding-bottom: calc(24px + var(--safe-b));
      width: 100%; max-width: 540px;
    }
    .overlay-box h3 { font-size: 1.05rem; margin-bottom: 8px; }
    .overlay-box p  { font-size: .9rem; color: var(--muted); margin-bottom: 20px; }
    .overlay-actions { display: flex; gap: 10px; }
    .overlay-actions button { flex: 1; }

    /* ── Export ── */
    .export-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }

    /* scrollbar */
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">🎣</span>
    <h1>Fish Log</h1>
  </header>

  <main id="main"></main>

  <nav>
    <button id="nav-log" class="active" onclick="showTab('log')">
      <span class="icon">➕</span>Log Catch
    </button>
    <button id="nav-history" onclick="showTab('history')">
      <span class="icon">📋</span>History
    </button>
    <button id="nav-stats" onclick="showTab('stats')">
      <span class="icon">📊</span>Stats
    </button>
  </nav>
</div>

<div id="toast"></div>
<div id="overlay">
  <div class="overlay-box">
    <h3 id="overlay-title"></h3>
    <p id="overlay-msg"></p>
    <div class="overlay-actions">
      <button class="btn btn-danger" id="overlay-confirm">Delete</button>
      <button class="btn" style="background:var(--border);color:var(--text)" onclick="closeOverlay()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ─── Data ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'fishlog_catches_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let catches = load();
let currentTab = 'log';
let pendingDeleteId = null;

const SPECIES = ['Bass','Trout','Walleye','Pike','Perch','Catfish','Crappie','Bluegill','Salmon','Musky','Carp','Tilapia'];

// ─── Routing ─────────────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  const main = document.getElementById('main');
  if (tab === 'log')     main.innerHTML = renderLogForm();
  if (tab === 'history') main.innerHTML = renderHistory();
  if (tab === 'stats')   main.innerHTML = renderStats();
  if (tab === 'log') initLogForm();
}

// ─── Log Form ────────────────────────────────────────────────────────────────
function renderLogForm() {
  const now = new Date();
  const localISO = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
  return `
  <div class="section-title">New Catch</div>
  <div class="card">
    <div class="form-grid">
      <div class="full">
        <label>Species</label>
        <div class="species-chips" id="chips">
          ${SPECIES.map(s => `<span class="chip" data-species="${s}" onclick="selectSpecies('${s}')">${s}</span>`).join('')}
        </div>
        <input id="f-species" type="text" placeholder="Species (tap above or type)" autocomplete="off" />
      </div>

      <div>
        <label>Length (in)</label>
        <input id="f-length" type="number" placeholder="e.g. 14" min="0" step="0.5" inputmode="decimal" />
      </div>
      <div>
        <label>Weight (lbs)</label>
        <input id="f-weight" type="number" placeholder="e.g. 2.5" min="0" step="0.1" inputmode="decimal" />
      </div>

      <div class="full">
        <label>Location</label>
        <input id="f-location" type="text" placeholder="e.g. Lake Tahoe, North Shore" autocomplete="off" />
      </div>

      <div class="full">
        <label>Lure / Bait</label>
        <input id="f-lure" type="text" placeholder="e.g. Rapala J11, nightcrawler" autocomplete="off" />
      </div>

      <div class="full">
        <label>Date &amp; Time</label>
        <input id="f-datetime" type="datetime-local" value="${localISO}" />
      </div>

      <div class="full">
        <label>Notes</label>
        <textarea id="f-notes" placeholder="Water conditions, weather, depth…"></textarea>
      </div>

      <div class="full toggle-row">
        <input type="checkbox" id="f-released" />
        <label for="f-released">Released (catch &amp; release)</label>
      </div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="submitCatch()">Save Catch 🎣</button>`;
}

function initLogForm() {
  const input = document.getElementById('f-species');
  if (!input) return;
  input.addEventListener('input', () => {
    const val = input.value.trim().toLowerCase();
    document.querySelectorAll('#chips .chip').forEach(c => {
      c.classList.toggle('sel', c.dataset.species.toLowerCase() === val);
    });
  });
}

function selectSpecies(name) {
  document.getElementById('f-species').value = name;
  document.querySelectorAll('#chips .chip').forEach(c =>
    c.classList.toggle('sel', c.dataset.species === name));
}

function submitCatch() {
  const species  = document.getElementById('f-species').value.trim();
  const length   = parseFloat(document.getElementById('f-length').value) || null;
  const weight   = parseFloat(document.getElementById('f-weight').value) || null;
  const location = document.getElementById('f-location').value.trim();
  const lure     = document.getElementById('f-lure').value.trim();
  const dt       = document.getElementById('f-datetime').value;
  const notes    = document.getElementById('f-notes').value.trim();
  const released = document.getElementById('f-released').checked;

  if (!species) { showToast('Please enter a species.'); return; }

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    timestamp: dt ? new Date(dt).toISOString() : new Date().toISOString(),
    species, length, weight, location, lure, notes, released
  };

  catches.unshift(entry);
  save(catches);
  showToast('Catch saved! 🎣');
  showTab('log');
}

// ─── History ─────────────────────────────────────────────────────────────────
let histFilter = { q: '', species: '' };

function renderHistory() {
  const speciesSet = [...new Set(catches.map(c => c.species))].sort();
  const filtered = filterCatches();
  const cards = filtered.length
    ? filtered.map(renderCatchCard).join('')
    : `<div class="empty"><div class="emoji">🌊</div><p>No catches yet. Go fish!</p></div>`;

  return `
  <div class="filter-bar">
    <input id="h-search" type="search" placeholder="Search species, location…"
      value="${histFilter.q}" oninput="updateFilter('q', this.value)" />
    <select id="h-species" onchange="updateFilter('species', this.value)">
      <option value="">All Species</option>
      ${speciesSet.map(s => `<option value="${s}" ${histFilter.species===s?'selected':''}>${s}</option>`).join('')}
    </select>
  </div>
  <div class="export-row">
    <button class="btn btn-primary btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
  </div>
  <div id="catch-list">${cards}</div>`;
}

function updateFilter(key, val) {
  histFilter[key] = val;
  document.getElementById('catch-list').innerHTML =
    filterCatches().length
      ? filterCatches().map(renderCatchCard).join('')
      : `<div class="empty"><div class="emoji">🔍</div><p>No catches match your filter.</p></div>`;
}

function filterCatches() {
  const q = histFilter.q.toLowerCase();
  return catches.filter(c => {
    const matchQ = !q || c.species.toLowerCase().includes(q) || (c.location||'').toLowerCase().includes(q) || (c.lure||'').toLowerCase().includes(q);
    const matchS = !histFilter.species || c.species === histFilter.species;
    return matchQ && matchS;
  });
}

function renderCatchCard(c) {
  const d = new Date(c.timestamp);
  const dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  const timeStr = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });

  const badges = [];
  if (c.length) badges.push(`<span class="badge badge-blue">📏 ${c.length}"</span>`);
  if (c.weight) badges.push(`<span class="badge badge-gold">⚖️ ${c.weight} lbs</span>`);
  if (c.lure)   badges.push(`<span class="badge badge-teal">🪝 ${esc(c.lure)}</span>`);
  if (c.released) badges.push(`<span class="badge badge-green">↩️ Released</span>`);

  const meta = [];
  if (c.location) meta.push(`📍 ${esc(c.location)}`);
  meta.push(`🕐 ${dateStr} ${timeStr}`);

  return `
  <div class="catch-card">
    <div class="catch-header">
      <span class="catch-species">${esc(c.species)}</span>
      <span class="catch-date">${dateStr}</span>
    </div>
    ${badges.length ? `<div class="catch-badges">${badges.join('')}</div>` : ''}
    <div class="catch-meta">${meta.join(' &nbsp;·&nbsp; ')}</div>
    ${c.notes ? `<div class="catch-notes">"${esc(c.notes)}"</div>` : ''}
    <div class="catch-actions">
      <button class="btn btn-danger btn-sm" onclick="confirmDelete('${c.id}','${esc(c.species)}')">Delete</button>
    </div>
  </div>`;
}

// ─── Stats ───────────────────────────────────────────────────────────────────
function renderStats() {
  if (!catches.length) return `<div class="empty"><div class="emoji">📊</div><p>Log some catches to see stats!</p></div>`;

  const total = catches.length;
  const released = catches.filter(c => c.released).length;
  const withLength = catches.filter(c => c.length);
  const withWeight = catches.filter(c => c.weight);
  const biggest = withLength.length ? withLength.reduce((a,b) => b.length > a.length ? b : a) : null;
  const heaviest = withWeight.length ? withWeight.reduce((a,b) => b.weight > a.weight ? b : a) : null;
  const avgLength = withLength.length ? (withLength.reduce((s,c) => s+c.length, 0) / withLength.length).toFixed(1) : '—';

  // species breakdown
  const bySpecies = {};
  catches.forEach(c => { bySpecies[c.species] = (bySpecies[c.species]||0) + 1; });
  const topSpecies = Object.entries(bySpecies).sort((a,b) => b[1]-a[1]).slice(0,5);

  // locations
  const byLocation = {};
  catches.forEach(c => { if(c.location) byLocation[c.location] = (byLocation[c.location]||0)+1; });
  const topLocations = Object.entries(byLocation).sort((a,b) => b[1]-a[1]).slice(0,5);

  return `
  <div class="section-title">Overview</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-label">Total Catches</div></div>
    <div class="stat-card"><div class="stat-val">${released}</div><div class="stat-label">Released</div></div>
    <div class="stat-card"><div class="stat-val">${biggest ? biggest.length + '"' : '—'}</div><div class="stat-label">Longest Fish</div></div>
    <div class="stat-card"><div class="stat-val">${heaviest ? heaviest.weight + ' lbs' : '—'}</div><div class="stat-label">Heaviest Fish</div></div>
    <div class="stat-card"><div class="stat-val">${avgLength}"</div><div class="stat-label">Avg Length</div></div>
    <div class="stat-card"><div class="stat-val">${Object.keys(bySpecies).length}</div><div class="stat-label">Species Caught</div></div>
  </div>

  ${biggest ? `<div class="card" style="margin-top:14px">
    <div class="section-title">🏆 Biggest Catch</div>
    <strong>${esc(biggest.species)}</strong> — ${biggest.length}"
    ${biggest.weight ? ` / ${biggest.weight} lbs` : ''}
    ${biggest.location ? `<br><span style="color:var(--muted);font-size:.82rem">📍 ${esc(biggest.location)}</span>` : ''}
  </div>` : ''}

  ${topSpecies.length ? `
  <div class="section-title" style="margin-top:14px">Top Species</div>
  <div class="leaderboard">
    ${topSpecies.map(([name, cnt], i) => `
    <div class="lb-row">
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name">${esc(name)}</span>
      <span class="lb-val">${cnt} catch${cnt>1?'es':''}</span>
    </div>`).join('')}
  </div>` : ''}

  ${topLocations.length ? `
  <div class="section-title" style="margin-top:14px">Top Spots</div>
  <div class="leaderboard">
    ${topLocations.map(([loc, cnt], i) => `
    <div class="lb-row">
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name">📍 ${esc(loc)}</span>
      <span class="lb-val">${cnt} catch${cnt>1?'es':''}</span>
    </div>`).join('')}
  </div>` : ''}`;
}

// ─── Delete ───────────────────────────────────────────────────────────────────
function confirmDelete(id, species) {
  pendingDeleteId = id;
  document.getElementById('overlay-title').textContent = 'Delete catch?';
  document.getElementById('overlay-msg').textContent = `Remove "${species}" from your log. This cannot be undone.`;
  document.getElementById('overlay-confirm').onclick = doDelete;
  document.getElementById('overlay').classList.add('open');
}

function doDelete() {
  catches = catches.filter(c => c.id !== pendingDeleteId);
  save(catches);
  closeOverlay();
  showToast('Catch deleted.');
  showTab('history');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
  pendingDeleteId = null;
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeOverlay();
});

// ─── Export CSV ───────────────────────────────────────────────────────────────
function exportCSV() {
  if (!catches.length) { showToast('No catches to export.'); return; }
  const headers = ['Date','Time','Species','Length (in)','Weight (lbs)','Location','Lure/Bait','Released','Notes'];
  const rows = catches.map(c => {
    const d = new Date(c.timestamp);
    return [
      d.toLocaleDateString(), d.toLocaleTimeString(),
      c.species, c.length||'', c.weight||'',
      c.location||'', c.lure||'', c.released?'Yes':'No', c.notes||''
    ].map(v => `"${String(v).replace(/"/g,'""')}"`);
  });
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fish-log-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSV exported!');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── Util ─────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Service Worker ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ─── Init ─────────────────────────────────────────────────────────────────────
showTab('log');
</script>
