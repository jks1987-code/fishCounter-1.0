<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fish Log" />
  <meta name="theme-color" content="#1a4a6b" />
  <title>Fish Log</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:  #1a4a6b;
      --blue:       #2563a8;
      --blue-light: #4a90c4;
      --teal:       #0e8080;
      --green:      #1e7a35;
      --green-lt:   #e3f7e8;
      --gold:       #d4a017;
      --bg:         #f0f6fb;
      --surface:    #ffffff;
      --border:     #c8dde8;
      --text:       #1a2e3b;
      --muted:      #5c7a8a;
      --danger:     #c0392b;
      --radius:     12px;
      --nav-h:      64px;
      --safe-b:     env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100%; max-width: 540px; margin: 0 auto; }
    header {
      background: var(--blue-dark);
      color: #fff;
      padding: 10px 20px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      display: flex; align-items: center; gap: 10px;
    }
    .logo-img { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; }

    main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px); }

    nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 540px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    nav button {
      flex: 1; background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: .68rem; font-weight: 600; color: var(--muted);
      padding: 8px 4px; transition: color .15s;
    }
    nav button .icon { font-size: 1.4rem; }
    nav button.active { color: var(--blue); }

    /* ── Quick Catch Hero Button ── */
    .btn-quick {
      width: 100%; border: none; border-radius: 20px; cursor: pointer;
      background: linear-gradient(135deg, #1e7a35 0%, #0d7070 100%);
      color: #fff; padding: 0;
      display: flex; align-items: center;
      box-shadow: 0 6px 24px rgba(14,128,128,.28), 0 2px 8px rgba(30,122,53,.22);
      transition: opacity .15s, transform .12s, box-shadow .15s;
      overflow: hidden; position: relative; min-height: 104px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-quick:active { transform: scale(.97); opacity: .92; box-shadow: 0 2px 8px rgba(14,128,128,.18); }
    .btn-quick:disabled { opacity: .65; cursor: not-allowed; transform: none; }
    .btn-quick .qc-icon {
      width: 96px; min-width: 96px; height: 104px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden; border-radius: 18px 0 0 18px;
    }
    .btn-quick .qc-icon img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .btn-quick .qc-text { padding: 0 16px; text-align: left; flex: 1; position: relative; z-index: 1; }
    .btn-quick .qc-title { font-size: 1.22rem; font-weight: 800; display: block; letter-spacing: .2px; }
    .btn-quick .qc-sub   { font-size: .8rem; opacity: .82; display: block; margin-top: 4px; }
    .btn-quick .qc-today {
      display: inline-block; margin-top: 8px;
      font-size: .72rem; font-weight: 700; opacity: .9;
      background: rgba(255,255,255,.18); border-radius: 10px; padding: 2px 9px;
    }

    /* ── Species Picker Grid ── */
    .species-img-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px;
    }
    .species-card {
      border: 2px solid var(--border); border-radius: 10px;
      padding: 8px 4px 6px; text-align: center; cursor: pointer;
      background: var(--bg); transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .species-card:hover, .species-card.sel { border-color: var(--teal); background: #e0f7f7; }
    .species-card:active { transform: scale(.93); }
    .species-card-img {
      width: 100%; height: 54px; object-fit: contain; display: block; margin-bottom: 4px;
    }
    .species-card-name { font-size: .63rem; font-weight: 700; color: var(--text); display: block; line-height: 1.2; }

    /* ── Catch card species thumbnail ── */
    .species-thumb {
      width: 28px; height: 22px; object-fit: contain; vertical-align: middle; margin-right: 1px;
    }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: .95rem; font-family: inherit; background: var(--bg); color: var(--text);
      outline: none; transition: border-color .15s; -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--blue-light); background: #fff; }
    textarea { resize: vertical; min-height: 70px; }

    /* weight / length compound inputs */
    .measure-row { display: flex; align-items: center; gap: 8px; }
    .measure-row input  { flex: 2; min-width: 0; }
    .measure-row select { flex: 2; min-width: 0; }
    .unit-lbl { font-size: .82rem; font-weight: 600; color: var(--muted); white-space: nowrap; flex-shrink: 0; }

    .species-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip {
      padding: 5px 11px; border-radius: 20px; font-size: .78rem; font-weight: 600;
      background: var(--surface); border: 1.5px solid var(--border);
      cursor: pointer; transition: all .15s; color: var(--muted);
    }
    .chip:hover, .chip.sel { background: var(--blue); border-color: var(--blue); color: #fff; }

    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .toggle-row label { margin: 0; font-size: .9rem; color: var(--text); font-weight: 500; }
    input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--green); }

    .btn {
      display: block; width: 100%; padding: 13px;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); opacity: .85; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-success { background: linear-gradient(135deg, #1e7a35 0%, #0d7070 100%); color: #fff; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-sm {
      display: inline-block; width: auto; padding: 6px 14px;
      font-size: .8rem; border-radius: 8px; font-weight: 600;
    }
    .btn-ghost { background: var(--bg); border: 1.5px solid var(--border); color: var(--text); }

    .section-title {
      font-size: .8rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px;
    }

    /* ── Catch card ── */
    .catch-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .catch-card.needs-details { border-left: 3px solid var(--gold); }
    .catch-card.tappable { cursor: pointer; transition: box-shadow .15s, transform .1s; }
    .catch-card.tappable:hover { box-shadow: 0 3px 14px rgba(37,99,168,.15); transform: translateY(-1px); }
    .catch-card.tappable:active { transform: scale(.99); box-shadow: none; }
    .catch-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .catch-species { font-size: 1.05rem; font-weight: 700; color: var(--blue-dark); display: flex; align-items: center; gap: 4px; }
    .catch-date { font-size: .75rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .catch-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 9px; border-radius: 6px; font-size: .75rem; font-weight: 600;
    }
    .badge-blue  { background: #e3f0fb; color: var(--blue); }
    .badge-green { background: var(--green-lt); color: var(--green); }
    .badge-gold  { background: #fdf5e0; color: #a07800; }
    .badge-teal  { background: #e0f7f7; color: var(--teal); }
    .badge-amber { background: #fff8e0; color: #8a6000; }
    .badge-gps   { background: var(--green-lt); color: var(--green); cursor: pointer; text-decoration: none; }
    .badge-gps:hover { background: #c0edcc; }

    /* ── Photo strip ── */
    .photos-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .photo-thumb {
      position: relative; width: 82px; height: 82px; border-radius: 10px;
      overflow: hidden; flex-shrink: 0; background: var(--border); cursor: pointer;
    }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-thumb-del {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
      border-radius: 50%; background: rgba(0,0,0,.65); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; color: #fff; font-weight: 700; line-height: 1;
    }
    .photo-btns { display: flex; gap: 8px; }
    .photo-hint { font-size: .72rem; color: var(--muted); margin-top: 5px; font-style: italic; }

    /* ── Full-screen photo viewer ── */
    #photo-viewer {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.93); z-index: 500;
      align-items: center; justify-content: center;
    }
    #photo-viewer.open { display: flex; }
    #photo-viewer img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 6px; }
    #photo-viewer-close {
      position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 20px;
      background: rgba(255,255,255,.18); border: none; color: #fff;
      font-size: 1.3rem; width: 38px; height: 38px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .catch-meta  { font-size: .8rem; color: var(--muted); margin-top: 7px; line-height: 1.5; }
    .catch-notes { font-size: .82rem; color: var(--text); margin-top: 7px; font-style: italic; }
    .catch-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 10px; }

    /* ── Recent Catches header ── */
    .recent-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .recent-header .section-title { margin: 0; }
    .count-badge { background: var(--blue); color: #fff; font-size: .7rem; font-weight: 700; padding: 2px 9px; border-radius: 10px; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { flex: 1; min-width: 100px; padding: 9px 12px; font-size: .88rem; }

    /* ── Import/Export row ── */
    .io-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

    /* ── Stats ── */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .stat-val { font-size: 2rem; font-weight: 800; color: var(--blue-dark); line-height: 1; }
    .stat-label { font-size: .75rem; color: var(--muted); margin-top: 5px; font-weight: 600; }
    .leaderboard { margin-top: 14px; }
    .lb-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 7px; font-size: .9rem;
    }
    .lb-rank { font-weight: 800; color: var(--blue); width: 24px; }
    .lb-name { flex: 1; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .lb-thumb { width: 28px; height: 20px; object-fit: contain; }
    .lb-val  { font-size: .82rem; color: var(--muted); font-weight: 600; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty .emoji { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: .95rem; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a2e3b; color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: .88rem; font-weight: 600;
      opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
      z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Bottom sheet overlays ── */
    .sheet-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 300;
      align-items: flex-end; justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet-box {
      background: var(--surface); border-radius: 16px 16px 0 0;
      padding: 20px; padding-bottom: calc(20px + var(--safe-b));
      width: 100%; max-width: 540px;
    }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    #edit-overlay .sheet-box, #species-overlay .sheet-box {
      max-height: 88vh; overflow-y: auto; padding-bottom: calc(24px + var(--safe-b));
    }
    .picker-title { font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .picker-sub   { font-size: .82rem; color: var(--muted); margin-bottom: 14px; }
    .sheet-box h3 { font-size: 1.05rem; margin-bottom: 8px; }
    .sheet-box p  { font-size: .9rem; color: var(--muted); margin-bottom: 20px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
    .sheet-actions button { flex: 1; }

    /* scrollbar */
    main::-webkit-scrollbar,
    #edit-overlay .sheet-box::-webkit-scrollbar,
    #species-overlay .sheet-box::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-thumb,
    #edit-overlay .sheet-box::-webkit-scrollbar-thumb,
    #species-overlay .sheet-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <img src="logo.png" class="logo-img" alt="Fish Log" />
    <h1>Fish Snap</h1>
  </header>

  <main id="main"></main>

  <nav>
    <button id="nav-log" class="active" onclick="showTab('log')">
      <span class="icon">➕</span>Log Catch
    </button>
    <button id="nav-history" onclick="showTab('history')">
      <span class="icon">📋</span>History
    </button>
    <button id="nav-stats" onclick="showTab('stats')">
      <span class="icon">📊</span>Stats
    </button>
  </nav>
</div>

<div id="toast"></div>

<!-- Delete confirmation sheet -->
<div id="delete-overlay" class="sheet-backdrop">
  <div class="sheet-box">
    <div class="sheet-handle"></div>
    <h3 id="del-title"></h3>
    <p id="del-msg"></p>
    <div class="sheet-actions">
      <button class="btn btn-danger" id="del-confirm">Delete</button>
      <button class="btn btn-ghost" onclick="closeDeleteOverlay()">Cancel</button>
    </div>
  </div>
</div>

<!-- Edit sheet -->
<div id="edit-overlay" class="sheet-backdrop">
  <div class="sheet-box">
    <div class="sheet-handle"></div>
    <div class="section-title" style="margin-bottom:14px">Edit Catch</div>
    <div id="edit-form-body"></div>
    <div class="sheet-actions">
      <button class="btn btn-success" onclick="saveEdit()">Save Changes</button>
      <button class="btn btn-ghost" onclick="closeEditOverlay()">Cancel</button>
    </div>
  </div>
</div>

<!-- Species picker sheet -->
<div id="species-overlay" class="sheet-backdrop">
  <div class="sheet-box">
    <div class="sheet-handle"></div>
    <div class="picker-title">🐟 What did you catch?</div>
    <div class="picker-sub">Select a species or type a custom name</div>
    <div id="species-picker-body"></div>
    <div class="sheet-actions">
      <button class="btn btn-success" onclick="confirmQuickCatch()">🎣 Log Catch</button>
      <button class="btn btn-ghost" onclick="skipSpecies()">Skip / Unknown</button>
    </div>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="csv-import-input"    accept=".csv"   style="display:none" onchange="importCSV(this)" />
<input type="file" id="photo-camera-input"  accept="image/*" capture="environment" style="display:none" onchange="editPhotoSelected(this)" />
<input type="file" id="photo-gallery-input" accept="image/*" style="display:none" onchange="editPhotoSelected(this)" />

<!-- Full-screen photo viewer -->
<div id="photo-viewer">
  <button id="photo-viewer-close" onclick="closePhotoViewer()">✕</button>
  <img id="photo-viewer-img" src="" alt="catch photo" />
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const STORAGE_KEY   = 'fishlog_catches_v1';
const LOCATIONS_KEY = 'fishlog_locations_v1';
const LURES_KEY     = 'fishlog_lures_v1';

// Alphabetical species list
const SPECIES = [
  'Bluegill','Crappie','Largemouth Bass','Muskie',
  'Perch','Pike','Salmon','Smallmouth Bass','Trout','Walleye'
];

const FISH_IMAGES = {
  'Walleye':        'walleyeemoj.png',
  'Smallmouth Bass':'smallmouthemoj.png',
  'Largemouth Bass':'largemouthemoji,.png',
  'Salmon':         'salmonemoj.png',
  'Crappie':        'blackcrappieemoj.png',
  'Bluegill':       'bluegillemoj.png',
  'Perch':          'perch.png',
  'Muskie':         'muskieemoji,.png',
  'Pike':           'pikeemoji,.png',
  'Trout':          'troutemoji,.png'
};

// ─── Data ─────────────────────────────────────────────────────────────────────
function load() {
  try {
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    // Migrate legacy species spellings
    data = data.map(c => {
      if (c.species === 'Musky') c.species = 'Muskie';
      return c;
    });
    return data;
  } catch { return []; }
}
function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function getLocations() { try { return JSON.parse(localStorage.getItem(LOCATIONS_KEY)) || []; } catch { return []; } }
function addLocation(loc) {
  if (!loc) return;
  const list = getLocations();
  if (!list.includes(loc)) { list.sort(); list.splice(sortedIndex(list, loc), 0, loc); localStorage.setItem(LOCATIONS_KEY, JSON.stringify(list)); }
}
function getLures() { try { return JSON.parse(localStorage.getItem(LURES_KEY)) || []; } catch { return []; } }
function addLure(lure) {
  if (!lure) return;
  const list = getLures();
  if (!list.includes(lure)) { list.sort(); list.splice(sortedIndex(list, lure), 0, lure); localStorage.setItem(LURES_KEY, JSON.stringify(list)); }
}
function sortedIndex(arr, val) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const mid = (lo + hi) >>> 1; if (arr[mid] < val) lo = mid + 1; else hi = mid; }
  return lo;
}

let catches = load();
let currentTab = 'log';
let pendingDeleteId = null;
let editingId = null;

// ─── Photo Storage (IndexedDB) ────────────────────────────────────────────────
let _photoDB = null;
function openPhotoDB() {
  if (_photoDB) return Promise.resolve(_photoDB);
  return new Promise((res, rej) => {
    const req = indexedDB.open('fishlog_photos_v1', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('photos', { keyPath: 'id' });
    req.onsuccess = e => { _photoDB = e.target.result; res(_photoDB); };
    req.onerror   = e => rej(e.target.error);
  });
}
function dbPutPhoto(id, blob) {
  return openPhotoDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').put({ id, blob });
    tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
  }));
}
function dbGetPhoto(id) {
  return openPhotoDB().then(db => new Promise((res, rej) => {
    const req = db.transaction('photos').objectStore('photos').get(id);
    req.onsuccess = e => res(e.target.result ? e.target.result.blob : null);
    req.onerror   = e => rej(e.target.error);
  }));
}
function dbDeletePhoto(id) {
  return openPhotoDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
  }));
}
function genPhotoId() {
  return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ─── Edit Photo State ─────────────────────────────────────────────────────────
let editPhotoState = { original: [], current: [], added: [], urls: {} };

function loadEditPhotos(photoIds) {
  editPhotoState = { original: [...photoIds], current: [...photoIds], added: [], urls: {} };
  if (!photoIds.length) return;
  Promise.all(photoIds.map(id => dbGetPhoto(id).then(blob => ({ id, blob })))).then(results => {
    results.forEach(({ id, blob }) => {
      if (blob) editPhotoState.urls[id] = URL.createObjectURL(blob);
    });
    renderEditPhotoStrip();
  });
}

function renderEditPhotoStrip() {
  const strip = document.getElementById('edit-photos-strip');
  if (!strip) return;
  strip.innerHTML = editPhotoState.current.map(id => {
    const url = editPhotoState.urls[id] || '';
    return `<div class="photo-thumb" onclick="viewPhoto('${id}')">
      ${url ? `<img src="${url}" alt="photo" />` : '<div style="width:100%;height:100%;background:var(--border)"></div>'}
      <button class="photo-thumb-del" onclick="event.stopPropagation();editRemovePhoto('${id}')">✕</button>
    </div>`;
  }).join('');
  const hint = document.getElementById('edit-photos-hint');
  if (hint) hint.style.display = editPhotoState.current.length ? '' : 'none';
}

function editAddPhoto(mode) {
  document.getElementById(mode === 'camera' ? 'photo-camera-input' : 'photo-gallery-input').click();
}

function editPhotoSelected(input) {
  const file = input.files[0];
  if (!file) return;
  const id = genPhotoId();
  dbPutPhoto(id, file).then(() => {
    editPhotoState.current.push(id);
    editPhotoState.added.push(id);
    editPhotoState.urls[id] = URL.createObjectURL(file);
    renderEditPhotoStrip();
  });
  input.value = '';
}

function editRemovePhoto(id) {
  editPhotoState.current = editPhotoState.current.filter(x => x !== id);
  if (editPhotoState.urls[id]) { URL.revokeObjectURL(editPhotoState.urls[id]); delete editPhotoState.urls[id]; }
  renderEditPhotoStrip();
}

function editCleanupPhotos(saved) {
  Object.values(editPhotoState.urls).forEach(u => URL.revokeObjectURL(u));
  if (saved) {
    // delete photos removed during editing
    editPhotoState.original.filter(id => !editPhotoState.current.includes(id)).forEach(dbDeletePhoto);
  } else {
    // cancel: undo any newly added photos
    editPhotoState.added.forEach(dbDeletePhoto);
  }
  editPhotoState = { original: [], current: [], added: [], urls: {} };
}

// ─── Photo Viewer ─────────────────────────────────────────────────────────────
function viewPhoto(id) {
  const url = editPhotoState.urls[id];
  if (!url) return;
  document.getElementById('photo-viewer-img').src = url;
  document.getElementById('photo-viewer').classList.add('open');
}
function closePhotoViewer() {
  document.getElementById('photo-viewer').classList.remove('open');
  document.getElementById('photo-viewer-img').src = '';
}
document.getElementById('photo-viewer').addEventListener('click', function(e) {
  if (e.target === this) closePhotoViewer();
});

// ─── Routing ──────────────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  const main = document.getElementById('main');
  if (tab === 'log')     main.innerHTML = renderLogTab();
  if (tab === 'history') main.innerHTML = renderHistory();
  if (tab === 'stats')   main.innerHTML = renderStats();
}

// ─── Species Picker ───────────────────────────────────────────────────────────
function quickCatch() {
  document.getElementById('species-picker-body').innerHTML = `
    <div class="species-img-grid" id="sp-grid">
      ${SPECIES.map(s => `
      <div class="species-card" data-species="${s}" onclick="selectSpeciesInPicker('${s}')">
        <img src="${FISH_IMAGES[s]}" alt="${s}" class="species-card-img" loading="lazy" />
        <span class="species-card-name">${s}</span>
      </div>`).join('')}
    </div>
    <input id="sp-species" type="text" placeholder="Or type a custom species…" autocomplete="off" style="margin-top:10px" />
  `;

  const input = document.getElementById('sp-species');
  input.addEventListener('input', () => {
    const val = input.value.trim().toLowerCase();
    document.querySelectorAll('#sp-grid .species-card').forEach(c =>
      c.classList.toggle('sel', c.dataset.species.toLowerCase() === val));
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') confirmQuickCatch(); });

  document.getElementById('species-overlay').classList.add('open');
  setTimeout(() => input.focus(), 320);
}

function selectSpeciesInPicker(name) {
  document.getElementById('sp-species').value = name;
  document.querySelectorAll('#sp-grid .species-card').forEach(c =>
    c.classList.toggle('sel', c.dataset.species === name));
}

function confirmQuickCatch() {
  const species = document.getElementById('sp-species').value.trim();
  closeSpeciesOverlay();
  doQuickCatch(species);
}

function skipSpecies() { closeSpeciesOverlay(); doQuickCatch(''); }

function closeSpeciesOverlay() {
  document.getElementById('species-overlay').classList.remove('open');
}
document.getElementById('species-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeSpeciesOverlay();
});

function doQuickCatch(species) {
  const btn = document.getElementById('qc-btn');
  if (btn) { btn.disabled = true; btn.querySelector('.qc-sub').textContent = 'Getting GPS…'; }

  const timestamp = new Date().toISOString();

  function finalize(gps) {
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      timestamp, species,
      length: null, weight: null,
      location: '', lure: '', notes: '',
      released: false, gps: gps || null
    };
    catches.unshift(entry);
    save(catches);

    if (btn) { btn.disabled = false; btn.querySelector('.qc-sub').textContent = 'Tap to select species & GPS'; }

    const label = species || 'Catch';
    showToast(gps ? `${label} logged! 📍 GPS captured` : `${label} logged!`);

    const wrap = document.getElementById('log-recent-wrap');
    if (wrap) wrap.innerHTML = renderRecentCatches();
  }

  if (!navigator.geolocation) { finalize(null); return; }
  navigator.geolocation.getCurrentPosition(
    pos => finalize({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }),
    ()  => finalize(null),
    { timeout: 12000, maximumAge: 30000, enableHighAccuracy: true }
  );
}

// ─── Log Tab ──────────────────────────────────────────────────────────────────
function renderLogTab() {
  const today = new Date().toDateString();
  const todayCount = catches.filter(c => new Date(c.timestamp).toDateString() === today).length;
  return `
  <button class="btn-quick" id="qc-btn" onclick="quickCatch()">
    <span class="qc-icon"><img src="logo.png" alt="Fish Log" /></span>
    <span class="qc-text">
      <span class="qc-title">Log a Catch</span>
      <span class="qc-sub">Tap to select species &amp; GPS</span>
      ${todayCount > 0 ? `<span class="qc-today">🐟 ${todayCount} caught today</span>` : ''}
    </span>
  </button>
  <div id="log-recent-wrap" style="margin-top:20px">
    ${catches.length ? renderRecentCatches() : renderLogEmpty()}
  </div>`;
}

function renderLogEmpty() {
  return `<div class="empty">
    <div class="emoji">🌊</div>
    <p style="font-weight:600;margin-bottom:6px">No catches yet!</p>
    <p style="font-size:.85rem;margin-top:4px">Tap the button above to log your first fish.</p>
  </div>`;
}

function renderRecentCatches() {
  const recent = catches.slice(0, 10);
  if (!recent.length) return renderLogEmpty();
  return `
  <div class="recent-header">
    <div class="section-title" style="margin:0">Recent Catches</div>
    <span class="count-badge">${catches.length} total</span>
  </div>
  ${recent.map(c => renderCatchCard(c, true)).join('')}
  ${catches.length > 10 ? `<p style="text-align:center;font-size:.82rem;color:var(--muted);padding:6px 0">+${catches.length - 10} more in History</p>` : ''}`;
}

// ─── History ──────────────────────────────────────────────────────────────────
let histFilter = { q: '', species: '' };

function renderHistory() {
  const speciesSet = [...new Set(catches.map(c => c.species).filter(Boolean))].sort();
  const filtered = filterCatches();
  const cards = filtered.length
    ? filtered.map(c => renderCatchCard(c, false)).join('')
    : `<div class="empty"><div class="emoji">🌊</div><p>No catches yet. Go fish!</p></div>`;

  return `
  <div class="filter-bar">
    <input id="h-search" type="search" placeholder="Search species, location…"
      value="${histFilter.q}" oninput="updateFilter('q', this.value)" />
    <select id="h-species" onchange="updateFilter('species', this.value)">
      <option value="">All Species</option>
      ${speciesSet.map(s => `<option value="${s}" ${histFilter.species===s?'selected':''}>${s}</option>`).join('')}
    </select>
  </div>
  <div class="io-row">
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('csv-import-input').click()">⬆ Import CSV</button>
    <button class="btn btn-primary btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn btn-primary btn-sm" onclick="exportGPX()">⬇ Export GPX</button>
  </div>
  <div id="catch-list">${cards}</div>`;
}

function updateFilter(key, val) {
  histFilter[key] = val;
  const list = filterCatches();
  document.getElementById('catch-list').innerHTML = list.length
    ? list.map(c => renderCatchCard(c, false)).join('')
    : `<div class="empty"><div class="emoji">🔍</div><p>No catches match your filter.</p></div>`;
}

function filterCatches() {
  const q = histFilter.q.toLowerCase();
  return catches.filter(c => {
    const matchQ = !q
      || (c.species||'').toLowerCase().includes(q)
      || (c.location||'').toLowerCase().includes(q)
      || (c.lure||'').toLowerCase().includes(q);
    const matchS = !histFilter.species || c.species === histFilter.species;
    return matchQ && matchS;
  });
}

// ─── Catch Card ───────────────────────────────────────────────────────────────
function renderCatchCard(c, tappable) {
  const d = new Date(c.timestamp);
  const dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  const timeStr = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  const needsDetails = !c.species;
  const stopProp = tappable ? 'event.stopPropagation();' : '';

  const imgSrc = c.species && FISH_IMAGES[c.species];
  const thumbHtml = imgSrc
    ? `<img src="${imgSrc}" class="species-thumb" alt="${esc(c.species)}" loading="lazy" />`
    : '';
  const speciesDisplay = c.species
    ? `${thumbHtml}${esc(c.species)}`
    : '<em style="color:var(--muted);font-weight:500">Unknown species</em>';

  const badges = [];
  if (c.length)   badges.push(`<span class="badge badge-blue">📏 ${formatLength(c.length)}</span>`);
  if (c.weight)   badges.push(`<span class="badge badge-gold">⚖️ ${formatWeight(c.weight)}</span>`);
  if (c.lure)     badges.push(`<span class="badge badge-teal">🪝 ${esc(c.lure)}</span>`);
  if (c.released) badges.push(`<span class="badge badge-green">↩️ Released</span>`);
  if (c.gps) {
    const mapsUrl = `https://maps.apple.com/?ll=${c.gps.lat},${c.gps.lng}&q=Catch`;
    badges.push(`<a href="${mapsUrl}" target="_blank" class="badge badge-gps" onclick="${stopProp}">📍 ${c.gps.lat.toFixed(5)}, ${c.gps.lng.toFixed(5)}</a>`);
  }
  if (c.photoIds && c.photoIds.length) badges.push(`<span class="badge badge-teal">📷 ${c.photoIds.length} photo${c.photoIds.length>1?'s':''}</span>`);
  if (needsDetails) badges.push(`<span class="badge badge-amber">✏️ Needs details</span>`);

  const meta = [];
  if (c.location) meta.push(`📍 ${esc(c.location)}`);
  meta.push(`🕐 ${dateStr} ${timeStr}`);
  if (c.gps && c.gps.acc) meta.push(`±${c.gps.acc}m`);

  const cardAttrs = tappable
    ? ` class="catch-card${needsDetails?' needs-details':''} tappable" onclick="openEdit('${c.id}')"`
    : ` class="catch-card${needsDetails?' needs-details':''}"`;

  return `
  <div${cardAttrs}>
    <div class="catch-header">
      <span class="catch-species">${speciesDisplay}</span>
      <span class="catch-date" title="${dateStr} ${timeStr}">${relativeTime(c.timestamp)}</span>
    </div>
    ${badges.length ? `<div class="catch-badges">${badges.join('')}</div>` : ''}
    <div class="catch-meta">${meta.join(' &nbsp;·&nbsp; ')}</div>
    ${c.notes ? `<div class="catch-notes">"${esc(c.notes)}"</div>` : ''}
    <div class="catch-actions">
      <button class="btn btn-primary btn-sm" onclick="${stopProp}openEdit('${c.id}')">Edit</button>
      <button class="btn btn-danger btn-sm" onclick="${stopProp}confirmDelete('${c.id}','${esc(c.species||'this catch')}')">Delete</button>
    </div>
  </div>`;
}

// ─── Edit ─────────────────────────────────────────────────────────────────────
function openEdit(id) {
  const c = catches.find(x => x.id === id);
  if (!c) return;
  editingId = id;

  const d = new Date(c.timestamp);
  const localISO = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0,16);

  const wLbs = c.weight ? Math.floor(c.weight) : '';
  const wOz  = c.weight ? Math.round((c.weight - Math.floor(c.weight)) * 16) : '';
  const lIn  = c.length ? Math.floor(c.length) : '';
  const lFrac = c.length ? (c.length - Math.floor(c.length)) : 0;

  const locOpts = getLocations().map(l => `<option value="${esc(l)}">`).join('');
  const lureOpts = getLures().map(l => `<option value="${esc(l)}">`).join('');

  document.getElementById('edit-form-body').innerHTML = `
    <datalist id="dl-locations">${locOpts}</datalist>
    <datalist id="dl-lures">${lureOpts}</datalist>
    <div class="form-grid">
      <div class="full">
        <label>Species</label>
        <div class="species-chips" id="edit-chips">
          ${SPECIES.map(s => `<span class="chip${c.species===s?' sel':''}" data-species="${s}" onclick="editSelectSpecies('${s}')">${s}</span>`).join('')}
        </div>
        <input id="e-species" type="text" value="${esc(c.species||'')}" placeholder="Species" autocomplete="off" />
      </div>

      <div>
        <label>Length</label>
        <div class="measure-row">
          <input id="e-length-in" type="number" value="${lIn}" min="0" max="120" placeholder="0" inputmode="numeric" />
          <span class="unit-lbl">in</span>
          <select id="e-length-frac">
            <option value="0"    ${lFrac<0.1?'selected':''}>—</option>
            <option value="0.25" ${Math.abs(lFrac-0.25)<0.05?'selected':''}>¼</option>
            <option value="0.5"  ${Math.abs(lFrac-0.5)<0.05?'selected':''}>½</option>
            <option value="0.75" ${Math.abs(lFrac-0.75)<0.05?'selected':''}>¾</option>
          </select>
        </div>
      </div>

      <div>
        <label>Weight</label>
        <div class="measure-row">
          <input id="e-weight-lbs" type="number" value="${wLbs}" min="0" max="999" placeholder="0" inputmode="numeric" />
          <span class="unit-lbl">lbs</span>
          <input id="e-weight-oz" type="number" value="${wOz}" min="0" max="15" placeholder="0" inputmode="numeric" style="max-width:52px" />
          <span class="unit-lbl">oz</span>
        </div>
      </div>

      <div class="full">
        <label>Location</label>
        <input id="e-location" type="text" list="dl-locations" value="${esc(c.location||'')}" placeholder="e.g. Lake Erie, North Shore" autocomplete="off" />
      </div>

      <div class="full">
        <label>Lure / Bait</label>
        <input id="e-lure" type="text" list="dl-lures" value="${esc(c.lure||'')}" placeholder="e.g. Rapala J11, nightcrawler" autocomplete="off" />
      </div>

      <div class="full">
        <label>Date &amp; Time</label>
        <input id="e-datetime" type="datetime-local" value="${localISO}" />
      </div>

      ${c.gps ? `<div class="full">
        <label>GPS Waypoint</label>
        <div style="font-size:.85rem;color:var(--muted);padding:8px 0">
          📍 ${c.gps.lat.toFixed(6)}, ${c.gps.lng.toFixed(6)}
          ${c.gps.acc ? `<span style="margin-left:6px">±${c.gps.acc}m</span>` : ''}
          &nbsp;·&nbsp; <a href="https://maps.apple.com/?ll=${c.gps.lat},${c.gps.lng}&q=Catch" target="_blank" style="color:var(--blue)">Open in Maps</a>
        </div>
      </div>` : ''}

      <div class="full">
        <label>Notes</label>
        <textarea id="e-notes" placeholder="Water conditions, weather, depth…">${esc(c.notes||'')}</textarea>
      </div>

      <div class="full toggle-row">
        <input type="checkbox" id="e-released" ${c.released?'checked':''} />
        <label for="e-released">Released (catch &amp; release)</label>
      </div>

      <div class="full">
        <label>Photos</label>
        <div id="edit-photos-strip" class="photos-strip"></div>
        <div id="edit-photos-hint" class="photo-hint" style="display:none">Long-press image → Save to Camera Roll</div>
        <div class="photo-btns" style="margin-top:8px">
          <button type="button" class="btn btn-ghost btn-sm" onclick="editAddPhoto('camera')">📷 Camera</button>
          <button type="button" class="btn btn-ghost btn-sm" onclick="editAddPhoto('gallery')">🖼 Gallery</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById('e-species');
  input.addEventListener('input', () => {
    const val = input.value.trim().toLowerCase();
    document.querySelectorAll('#edit-chips .chip').forEach(ch =>
      ch.classList.toggle('sel', ch.dataset.species.toLowerCase() === val));
  });

  document.getElementById('edit-overlay').classList.add('open');
  loadEditPhotos(c.photoIds || []);
}

function editSelectSpecies(name) {
  document.getElementById('e-species').value = name;
  document.querySelectorAll('#edit-chips .chip').forEach(c =>
    c.classList.toggle('sel', c.dataset.species === name));
}

function saveEdit() {
  const idx = catches.findIndex(x => x.id === editingId);
  if (idx === -1) return;

  const dt      = document.getElementById('e-datetime').value;
  const location = document.getElementById('e-location').value.trim();
  const lure     = document.getElementById('e-lure').value.trim();

  const lIn   = parseInt(document.getElementById('e-length-in').value)   || 0;
  const lFrac = parseFloat(document.getElementById('e-length-frac').value) || 0;
  const length = (lIn + lFrac) || null;

  const wLbs = parseInt(document.getElementById('e-weight-lbs').value) || 0;
  const wOz  = parseInt(document.getElementById('e-weight-oz').value)  || 0;
  const weight = (wLbs + wOz / 16) || null;

  catches[idx] = {
    ...catches[idx],
    species:   document.getElementById('e-species').value.trim(),
    length, weight, location, lure,
    timestamp: dt ? new Date(dt).toISOString() : catches[idx].timestamp,
    notes:     document.getElementById('e-notes').value.trim(),
    released:  document.getElementById('e-released').checked,
    photoIds:  [...editPhotoState.current],
  };

  save(catches);
  addLocation(location);
  addLure(lure);
  editCleanupPhotos(true);
  document.getElementById('edit-overlay').classList.remove('open');
  editingId = null;
  showToast('Catch updated!');
  if (currentTab === 'history') showTab('history');
  if (currentTab === 'log') {
    const wrap = document.getElementById('log-recent-wrap');
    if (wrap) wrap.innerHTML = catches.length ? renderRecentCatches() : renderLogEmpty();
  }
}

function closeEditOverlay() {
  editCleanupPhotos(false);
  document.getElementById('edit-overlay').classList.remove('open');
  editingId = null;
}
document.getElementById('edit-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeEditOverlay();
});

// ─── Stats ────────────────────────────────────────────────────────────────────
function renderStats() {
  if (!catches.length) return `<div class="empty"><div class="emoji">📊</div><p>Log some catches to see stats!</p></div>`;

  const total = catches.length;
  const released = catches.filter(c => c.released).length;
  const withLength = catches.filter(c => c.length);
  const withWeight = catches.filter(c => c.weight);
  const biggest  = withLength.length ? withLength.reduce((a,b) => b.length > a.length ? b : a) : null;
  const heaviest = withWeight.length ? withWeight.reduce((a,b) => b.weight > a.weight ? b : a) : null;
  const avgLength = withLength.length ? (withLength.reduce((s,c) => s+c.length, 0) / withLength.length).toFixed(1) : '—';

  const bySpecies = {};
  catches.forEach(c => { if(c.species) bySpecies[c.species] = (bySpecies[c.species]||0) + 1; });
  const topSpecies = Object.entries(bySpecies).sort((a,b) => b[1]-a[1]).slice(0,5);

  const byLocation = {};
  catches.forEach(c => { if(c.location) byLocation[c.location] = (byLocation[c.location]||0)+1; });
  const topLocations = Object.entries(byLocation).sort((a,b) => b[1]-a[1]).slice(0,5);

  const gpsCount = catches.filter(c => c.gps).length;

  return `
  <div class="section-title">Overview</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-label">Total Catches</div></div>
    <div class="stat-card"><div class="stat-val">${released}</div><div class="stat-label">Released</div></div>
    <div class="stat-card"><div class="stat-val">${biggest ? formatLength(biggest.length) : '—'}</div><div class="stat-label">Longest Fish</div></div>
    <div class="stat-card"><div class="stat-val">${heaviest ? formatWeight(heaviest.weight) : '—'}</div><div class="stat-label">Heaviest Fish</div></div>
    <div class="stat-card"><div class="stat-val">${avgLength}"</div><div class="stat-label">Avg Length</div></div>
    <div class="stat-card"><div class="stat-val">${gpsCount}</div><div class="stat-label">GPS Waypoints</div></div>
  </div>

  ${biggest ? `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)">
    <div class="section-title">🏆 Biggest Catch</div>
    <strong>${esc(biggest.species)}</strong> — ${formatLength(biggest.length)}
    ${biggest.weight ? ` / ${formatWeight(biggest.weight)}` : ''}
    ${biggest.location ? `<br><span style="color:var(--muted);font-size:.82rem">📍 ${esc(biggest.location)}</span>` : ''}
  </div>` : ''}

  ${topSpecies.length ? `
  <div class="section-title" style="margin-top:14px">Top Species</div>
  <div class="leaderboard">
    ${topSpecies.map(([name, cnt], i) => {
      const img = FISH_IMAGES[name] ? `<img src="${FISH_IMAGES[name]}" class="lb-thumb" loading="lazy" />` : '🐟';
      return `<div class="lb-row">
        <span class="lb-rank">${i+1}</span>
        <span class="lb-name">${img}${esc(name)}</span>
        <span class="lb-val">${cnt} catch${cnt>1?'es':''}</span>
      </div>`;
    }).join('')}
  </div>` : ''}

  ${topLocations.length ? `
  <div class="section-title" style="margin-top:14px">Top Spots</div>
  <div class="leaderboard">
    ${topLocations.map(([loc, cnt], i) => `
    <div class="lb-row">
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name">📍 ${esc(loc)}</span>
      <span class="lb-val">${cnt} catch${cnt>1?'es':''}</span>
    </div>`).join('')}
  </div>` : ''}`;
}

// ─── Delete ───────────────────────────────────────────────────────────────────
function confirmDelete(id, species) {
  pendingDeleteId = id;
  document.getElementById('del-title').textContent = 'Delete catch?';
  document.getElementById('del-msg').textContent = `Remove "${species}" from your log. This cannot be undone.`;
  document.getElementById('del-confirm').onclick = doDelete;
  document.getElementById('delete-overlay').classList.add('open');
}

function doDelete() {
  catches = catches.filter(c => c.id !== pendingDeleteId);
  save(catches);
  closeDeleteOverlay();
  showToast('Catch deleted.');
  if (currentTab === 'history') showTab('history');
  if (currentTab === 'log') {
    const wrap = document.getElementById('log-recent-wrap');
    if (wrap) wrap.innerHTML = catches.length ? renderRecentCatches() : renderLogEmpty();
  }
}

function closeDeleteOverlay() {
  document.getElementById('delete-overlay').classList.remove('open');
  pendingDeleteId = null;
}
document.getElementById('delete-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeDeleteOverlay();
});

// ─── Export CSV ───────────────────────────────────────────────────────────────
function exportCSV() {
  if (!catches.length) { showToast('No catches to export.'); return; }
  const headers = ['Date','Time','Species','Length (in)','Weight (lbs)','Location','Lure/Bait','Released','Notes','GPS Lat','GPS Lng','GPS Accuracy (m)'];
  const rows = catches.map(c => {
    const d = new Date(c.timestamp);
    return [
      d.toLocaleDateString(), d.toLocaleTimeString(),
      c.species||'', c.length||'', c.weight||'',
      c.location||'', c.lure||'', c.released?'Yes':'No', c.notes||'',
      c.gps?c.gps.lat:'', c.gps?c.gps.lng:'', c.gps?(c.gps.acc||''):''
    ].map(v => `"${String(v).replace(/"/g,'""')}"`);
  });
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  downloadBlob(csv, 'text/csv', `fish-log-${isoDate()}.csv`);
  showToast('CSV exported!');
}

// ─── Import CSV ───────────────────────────────────────────────────────────────
function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n');
    if (lines.length < 2) { showToast('CSV appears empty.'); return; }
    let imported = 0, skipped = 0;
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const v = parseCSVRow(line);
      // Expected columns: Date,Time,Species,Length,Weight,Location,Lure,Released,Notes,Lat,Lng,Acc
      if (v.length < 2) continue;
      const parsed = new Date(`${v[0]} ${v[1]}`);
      const timestamp = isNaN(parsed.getTime()) ? new Date().toISOString() : parsed.toISOString();
      const species  = (v[2]||'').trim();
      const length   = parseFloat(v[3]) || null;
      const weight   = parseFloat(v[4]) || null;
      const location = (v[5]||'').trim();
      const lure     = (v[6]||'').trim();
      const released = (v[7]||'').trim().toLowerCase() === 'yes';
      const notes    = (v[8]||'').trim();
      const lat      = parseFloat(v[9]);
      const lng      = parseFloat(v[10]);
      const acc      = parseFloat(v[11]) || null;
      const gps = (isFinite(lat) && isFinite(lng)) ? { lat, lng, acc } : null;
      const entry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2) + i,
        timestamp, species, length, weight, location, lure, notes, released, gps
      };
      catches.push(entry);
      if (location) addLocation(location);
      if (lure)     addLure(lure);
      imported++;
    }
    catches.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
    save(catches);
    showToast(`Imported ${imported} catch${imported!==1?'es':''}!`);
    if (currentTab === 'log') {
      const wrap = document.getElementById('log-recent-wrap');
      if (wrap) wrap.innerHTML = catches.length ? renderRecentCatches() : renderLogEmpty();
    } else if (currentTab === 'history') showTab('history');
  };
  reader.readAsText(file);
  input.value = '';
}

function parseCSVRow(line) {
  const fields = []; let field = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { field += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      fields.push(field); field = '';
    } else { field += ch; }
  }
  fields.push(field);
  return fields;
}

// ─── Export GPX ───────────────────────────────────────────────────────────────
function exportGPX() {
  const withGPS = catches.filter(c => c.gps);
  if (!withGPS.length) { showToast('No GPS catches to export.'); return; }

  const wpts = withGPS.map(c => {
    const desc = [
      c.species,
      c.length ? formatLength(c.length) : null,
      c.weight ? formatWeight(c.weight) : null,
      c.location, c.lure, c.notes
    ].filter(Boolean).join(' · ');
    return `  <wpt lat="${c.gps.lat}" lon="${c.gps.lng}">
    <ele>0</ele>
    <time>${new Date(c.timestamp).toISOString()}</time>
    <name>${escX(c.species || 'Catch')}</name>
    <desc>${escX(desc)}</desc>
    <sym>Fish</sym>
  </wpt>`;
  }).join('\n');

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Fish Log" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>Fish Log Waypoints</name>
    <time>${new Date().toISOString()}</time>
  </metadata>
${wpts}
</gpx>`;

  downloadBlob(gpx, 'application/gpx+xml', `fish-log-${isoDate()}.gpx`);
  showToast(`GPX exported — ${withGPS.length} waypoint${withGPS.length!==1?'s':''}!`);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function formatLength(l) {
  if (!l) return '—';
  const w = Math.floor(l), f = l - w;
  const fStr = Math.abs(f-0.25)<0.05?'¼':Math.abs(f-0.5)<0.05?'½':Math.abs(f-0.75)<0.05?'¾':'';
  return `${w}${fStr}"`;
}

function formatWeight(w) {
  if (!w) return '—';
  const lbs = Math.floor(w);
  const oz  = Math.round((w - lbs) * 16);
  if (oz === 0)  return `${lbs} lbs`;
  if (lbs === 0) return `${oz} oz`;
  return `${lbs} lbs ${oz} oz`;
}

function relativeTime(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 7)  return `${d}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

function downloadBlob(content, type, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename;
  a.click();
}

function isoDate() { return new Date().toISOString().slice(0,10); }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escX(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ─── Service Worker ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ─── Init ─────────────────────────────────────────────────────────────────────
showTab('log');
</script>
